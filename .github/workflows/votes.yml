name: Deploy votes service

# Deploys worker/ (votes, newsletter sign-ups, live stats) to Cloudflare Workers + D1.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets; without
# them the run explains what to add and stops. See docs/setup.md, "Votes".
on:
  workflow_dispatch:
    inputs:
      kit_form_id:
        description: "Kit form ID (the number in the form's URL); overrides config/site.json"
        required: false
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/votes.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      KIT_FORM_ID: ${{ inputs.kit_form_id || secrets.KIT_FORM_ID }}
      WRANGLER: npx --yes wrangler@4
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "### Votes service not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/setup.md, \"Votes\"), then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or find the database
        if: steps.creds.outputs.ok == 'true'
        run: |
          find_db() { $WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="delegatedto-votes");process.stdout.write(db?(db.uuid||db.id||""):"")})'; }
          id=$(find_db)
          if [ -z "$id" ]; then $WRANGLER d1 create delegatedto-votes; id=$(find_db); fi
          test -n "$id"
          sed -i "s/REPLACED_BY_WORKFLOW/$id/" wrangler.toml
          $WRANGLER d1 execute delegatedto-votes --remote --file schema.sql

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: |
          $WRANGLER deploy | tee deploy.log
          echo "### Votes service deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Served at https://api.delegatedto.ai (worker/wrangler.toml); the site reads it from config/site.json." >> "$GITHUB_STEP_SUMMARY"

      - name: Set the hashing salt once
        if: steps.creds.outputs.ok == 'true'
        run: |
          if ! $WRANGLER secret list | grep -q '"SALT"'; then
            openssl rand -hex 32 | $WRANGLER secret put SALT
          fi

      - name: Connect the newsletter (Kit), when its secrets are set
        if: steps.creds.outputs.ok == 'true'
        run: |
          KIT_API_KEY=$(printf '%s' "$KIT_API_KEY" | tr -d '[:space:]')
          KIT_FORM_ID=$(printf '%s' "$KIT_FORM_ID" | tr -d '[:space:]')
          # The form ID isn't secret: it normally lives in config/site.json (newsletter.kitFormId).
          [ -n "$KIT_FORM_ID" ] || KIT_FORM_ID=$(node -p 'require("../config/site.json").newsletter?.kitFormId || ""')
          # Without KIT_FORM_ID, use the account's form when it has exactly one.
          if [ -n "$KIT_API_KEY" ] && [ -z "$KIT_FORM_ID" ]; then
            KIT_FORM_ID=$(node -e '
              fetch("https://api.kit.com/v4/forms?status=active", { headers: { "X-Kit-Api-Key": process.env.KIT_API_KEY } })
                .then((r) => r.json())
                .then((j) => {
                  const forms = j.forms || [];
                  if (forms.length === 1) return process.stdout.write(String(forms[0].id));
                  console.error(j.errors ? "Kit: " + j.errors.join("; ") : forms.length ? "Several forms: " + forms.map((f) => `${f.name} (${f.id})`).join(", ") : "No active form in Kit yet.");
                });')
          fi
          if [ -n "$KIT_API_KEY" ] && [ -n "$KIT_FORM_ID" ]; then
            printf '%s' "$KIT_API_KEY" | $WRANGLER secret put KIT_API_KEY
            printf '%s' "$KIT_FORM_ID" | $WRANGLER secret put KIT_FORM_ID
            echo "Newsletter sign-ups connected to Kit (form $KIT_FORM_ID)." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$KIT_API_KEY" ]; then
            echo "Newsletter sign-ups are off: couldn't pick a Kit form (see the log). Set newsletter.kitFormId in config/site.json (the number in the form's URL in Kit)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "Newsletter sign-ups are off: add the KIT_API_KEY repository secret (docs/setup.md, \"Newsletter\") and re-run." >> "$GITHUB_STEP_SUMMARY"
          fi
