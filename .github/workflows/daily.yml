name: Daily update & deploy

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:
    inputs:
      skip_curation:
        description: "Only rebuild and deploy the site"
        type: boolean
        default: false
      writeups_only:
        description: "Only fill in missing write-ups (no collection or curation)"
        type: boolean
        default: false
      rewrite_plain:
        description: "Rewrite every entry's title, summary and write-up in plain language (no collection or curation)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  issues: read

concurrency:
  group: daily-site
  cancel-in-progress: false

jobs:
  curate:
    # Pushes to main only redeploy; the schedule and manual runs also collect + curate.
    if: github.event_name != 'push' && !inputs.skip_curation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect candidates
        if: ${{ !inputs.writeups_only && !inputs.rewrite_plain }}
        run: node scripts/collect.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ vars.REDDIT_USERNAME }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

      - name: Curate with Claude
        if: ${{ !inputs.writeups_only && !inputs.rewrite_plain }}
        run: node scripts/curate.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURATOR_MODEL: ${{ vars.CURATOR_MODEL }}
          PUBLISH_THRESHOLD: ${{ vars.PUBLISH_THRESHOLD }}
          DAILY_MAX: ${{ vars.DAILY_MAX }}

      - name: Fill in missing write-ups
        run: node scripts/enrich.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURATOR_MODEL: ${{ vars.CURATOR_MODEL }}

      - name: Rewrite entries in plain language
        if: ${{ inputs.rewrite_plain }}
        run: node scripts/rewrite.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CURATOR_MODEL: ${{ vars.CURATOR_MODEL }}

      - run: node scripts/validate.mjs

      - name: Keep the raw candidates for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates-${{ github.run_id }}
          path: .cache/candidates.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit new entries
        run: |
          git config user.name "delegatedto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Daily update $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: curate
    # Launch switch: nothing is published until the repository variable SITE_LIVE is "true"
    # (Settings → Secrets and variables → Actions → Variables). Publishes to Cloudflare
    # (deploy/wrangler.toml) with the same CLOUDFLARE_* secrets as the votes service.
    # Runs after curation, or on its own when curation was skipped (push / skip_curation).
    if: >-
      always() && vars.SITE_LIVE == 'true' &&
      (needs.curate.result == 'success' || needs.curate.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # picks up the commit the curate job just pushed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VOTES_API: ${{ vars.VOTES_API }}
      - name: Publish to Cloudflare
        run: |
          npx --yes wrangler@4 deploy --config deploy/wrangler.toml | tee deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Site published" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare address: ${url:-see the log above}. Custom domain: docs/setup.md, \"Publish on Cloudflare\"." >> "$GITHUB_STEP_SUMMARY"

      # The daily email (docs/setup.md, "Newsletter"). Scheduled runs only, after the deploy,
      # so its links work; it skips itself without KIT_API_KEY and never sends twice a day.
      - name: Send the daily email
        if: github.event_name == 'schedule'
        run: node scripts/digest.mjs
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}

  deploy-held:
    needs: curate
    if: always() && vars.SITE_LIVE != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### Deploy held" >> "$GITHUB_STEP_SUMMARY"
          echo "The site was not published because the repository variable \`SITE_LIVE\` is not \`true\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Curation result: ${{ needs.curate.result }}. New entries, if any, are committed to the repository." >> "$GITHUB_STEP_SUMMARY"
