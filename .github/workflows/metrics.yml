name: Site metrics

# Collects visitors, subscribers, votes, search and pipeline numbers for the owner's
# dashboard (scripts/metrics.mjs) and commits them as JSON to the `metrics` branch, which
# a scheduled task loads into the dashboard. Sources without their secrets are skipped.
on:
  schedule:
    - cron: "40 */6 * * *" # every 6 hours, after the daily run at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Get the previous numbers
        run: |
          mkdir -p .metrics
          if git fetch --depth=1 origin metrics 2>/dev/null; then
            git --work-tree=.metrics checkout FETCH_HEAD -- metrics 2>/dev/null || true
          fi
          mkdir -p .metrics/metrics

      - name: Collect
        run: node scripts/metrics.mjs .metrics/metrics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOTES_API: ${{ vars.VOTES_API }}

      - name: Save to the metrics branch
        run: |
          cd .metrics
          git init -q -b metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git commit -qm "Metrics $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" metrics:metrics
